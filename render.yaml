# Madisonville Branch Talk Tracker
# Production records stay in the "Branch Talk Tracker" Google Sheet.
# On startup the Events tab gains an end_date column when it is missing.
# Blank end dates are set to the start date. Members and Talks are not rewritten.
services:
  - type: web
    name: madisonville-talk-tracker
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run madisonville_talk_tracker.py --server.port=$PORT --server.address=0.0.0.0 --server.headless=true --server.enableCORS=false --server.enableXsrfProtection=false --browser.gatherUsageStats=false
    envVars:
      - key: PYTHON_VERSION
        value: "3.12.8"
      - key: STREAMLIT_SERVER_HEADLESS
        value: "true"
      - key: STREAMLIT_BROWSER_GATHER_USAGE_STATS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_CORS
        value: "false"
      - key: STREAMLIT_SERVER_ENABLE_XSRF_PROTECTION
        value: "false"
